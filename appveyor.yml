clone_depth: 200
version: '1.12.{build}'
image: Visual Studio 2022
skip_branch_with_pr: true

cache:
  - C:\ProgramData\chocolatey\bin -> appveyor.yml
  - C:\ProgramData\chocolatey\lib -> appveyor.yml
  - C:\Qt\6.11.2\msvc2022_64 -> appveyor.yml
  - C:\Qt\6.11.2\mingw_64 -> appveyor.yml
  - C:\Qt\Tools\mingw1310_64 -> appveyor.yml
  - C:\ccache

environment:
  QASEPRITE_VERSION: 1.0.3
  CCACHE_MAXSIZE: 400M
  matrix:
    - QT_VERSION: 6.11.2
      QT_ARCH: win64_msvc2022_64
      QT_MODULES: qtimageformats qtshadertools
      QTDIR: C:\Qt\6.11.2\msvc2022_64
      PYTHONHOME: C:\Python312-x64
      DEFAULT_PROFILE: MSVC2022-x64
      FILE_SUFFIX: Windows-10+_msvc_x86_64
      PUSH_RELEASE: false
      ENABLE_ZSTD: false
      CCACHE_DIR: C:\ccache\msvc
    - QT_VERSION: 6.11.2
      QT_ARCH: win64_mingw
      QT_MODULES: qtimageformats qtshadertools
      QTDIR: C:\Qt\6.11.2\mingw_64
      PYTHONHOME: C:\Python312-x64
      MINGW: C:\Qt\Tools\mingw1310_64
      MINGW_COMPONENT: tools_mingw1310
      MINGW_VARIANT: qt.tools.win64_mingw1310
      FILE_SUFFIX: Windows-10+_x86_64
      PUSH_RELEASE: true
      ENABLE_ZSTD: true
      CC: x86_64-w64-mingw32-gcc.exe
      CXX: x86_64-w64-mingw32-g++.exe
      CCACHE_DIR: C:\ccache\mingw

configuration: Release

install:
  - choco install -y qbs --version 3.1.1
  - choco install -y ccache --version 4.14.2
  - set PATH=%PYTHONHOME%;%PYTHONHOME%\Scripts;%PATH%
  # aqtinstall 3.3.0 does not yet support the changed repository layout of
  # Qt 6.11 on Windows
  - python -m pip install git+https://github.com/miurahr/aqtinstall.git@9e49c82edc6d946db376dec907cca5b4b486eec5
  - if not exist %QTDIR%\bin\qmake.exe if "%QT_MODULES%"=="" (aqt install-qt -O C:\Qt windows desktop %QT_VERSION% %QT_ARCH%) else (aqt install-qt -O C:\Qt windows desktop %QT_VERSION% %QT_ARCH% -m %QT_MODULES%)
  - if defined MINGW if not exist %MINGW%\bin\%CC% aqt install-tool -O C:\Qt windows desktop %MINGW_COMPONENT% %MINGW_VARIANT%
  - set PATH=%QTDIR%\bin;%MINGW%\bin;%PATH%

before_build:
  - qbs --version
  - if defined MINGW qbs setup-toolchains %MINGW%\bin\%CC% mingw
  - if defined MINGW qbs config defaultProfile mingw
  - if defined DEFAULT_PROFILE qbs setup-toolchains --detect
  - if defined DEFAULT_PROFILE qbs config defaultProfile %DEFAULT_PROFILE%

build_script:
  - FOR /F "tokens=*" %%i in ('git describe') do SET COMMITNOW=%%i
  - if "%APPVEYOR_REPO_TAG_NAME:~0,1%"=="v" (set TILED_RELEASE=true) else (set TILED_SNAPSHOT=true)
  - if defined TILED_RELEASE set TILED_VERSION=%APPVEYOR_REPO_TAG_NAME:~1%
  - if defined TILED_SNAPSHOT set TILED_VERSION=%DATE:~10,4%.%DATE:~4,2%.%DATE:~7,2%
  - if defined TILED_SNAPSHOT set TILED_MSI_VERSION=%APPVEYOR_BUILD_VERSION%
  - ccache -z
  - if defined MINGW echo Building zstd
  - if defined MINGW git clone --depth 1 -b release https://github.com/facebook/zstd.git
  - if defined MINGW cd zstd/lib & set CC=ccache gcc & mingw32-make -j2 libzstd.a & cd ../../
  # qaseprite installs its plugin into the cached Qt plugins directory, so
  # an existing qaseprite.dll matches the pinned Qt and qaseprite versions
  - if exist %QTDIR%\plugins\imageformats\qaseprite.dll (echo Using cached qaseprite.dll) else (call dist\win\build-qaseprite.bat)
  - echo Building Tiled %TILED_VERSION% from %COMMITNOW%
  # Keep the libtilededitor PCH: without it a cold build exceeds the 60
  # minute job limit re-parsing the Qt headers for every file
  - qbs build config:release projects.Tiled.windowsInstaller:true projects.Tiled.staticZstd:%ENABLE_ZSTD% modules.cpp.compilerWrapper:ccache products.libtilededitor.cpp.useCxxPrecompiledHeader:true
  - ccache -s

after_build:
  - cd release
  - cd installer*
  - move tiled-*.msi %APPVEYOR_BUILD_FOLDER%\Tiled-%TILED_VERSION%_%FILE_SUFFIX%.msi
  - cd ..
  - cd archive*
  - move tiled-*.7z %APPVEYOR_BUILD_FOLDER%
  - cd ..\..

artifacts:
  - name: Installer
    path: 'Tiled-*.msi'
  - name: Archive
    path: 'tiled-*.7z'

deploy:
  - provider: FTP
    protocol: sftp
    host: update.mapeditor.org
    username: update
    password:
      secure: YPoSL+S82PCgS5PYbhtxQv0YD7uwZAX9LhjJBBbDGvk=
    folder: update.mapeditor.org/snapshots-win
    artifact: /.*\.(msi|7z)/
    on:
      branch: snapshot
      push_release: true

  - provider: Webhook
    url: https://app.signpath.io/API/v1/670574d6-49bf-4a0c-824a-3ae977077079/Integrations/AppVeyor?ProjectKey=tiled&SigningPolicyKey=test-signing
    authorization:
      secure: 4E7IuM1Ftvdkx43gsqI3tUWb6tcvrfKB22sa6DsWaBzT+zv3DqceDCk0qc/JqTO+Er5UQNYwolmWBzMdys6fVA==
    on:
      appveyor_repo_tag: false
      branch: master
      push_release: true

  - provider: Webhook
    url: https://app.signpath.io/API/v1/670574d6-49bf-4a0c-824a-3ae977077079/Integrations/AppVeyor?ProjectKey=tiled&SigningPolicyKey=release-signing
    authorization:
      secure: 4E7IuM1Ftvdkx43gsqI3tUWb6tcvrfKB22sa6DsWaBzT+zv3DqceDCk0qc/JqTO+Er5UQNYwolmWBzMdys6fVA==
    on:
      branch: snapshot
      push_release: true

  - provider: Webhook
    url: https://app.signpath.io/API/v1/670574d6-49bf-4a0c-824a-3ae977077079/Integrations/AppVeyor?ProjectKey=tiled&SigningPolicyKey=release-signing
    authorization:
      secure: 4E7IuM1Ftvdkx43gsqI3tUWb6tcvrfKB22sa6DsWaBzT+zv3DqceDCk0qc/JqTO+Er5UQNYwolmWBzMdys6fVA==
    on:
      appveyor_repo_tag: true
      push_release: true
